
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffeef2;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; 
            touch-action: manipulation;
        }

        h1 {
            color: #d63384;
            font-size: 28px;
            margin-bottom: 50px; /* More space so buttons aren't too close */
            text-align: center;
            padding: 0 20px;
        }

        /* Container ensures buttons stay in one place initially */
        .btn-container {
            position: relative;
            width: 300px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent; /* Removes iPhone blue tap box */
        }

        .yes-btn {
            background-color: #ff4d6d;
            color: white;
            margin-right: 20px; /* Space between Yes and No */
            z-index: 10;
        }

        .no-btn {
            background-color: #6c757d;
            color: white;
            position: absolute; /* Vital for moving */
            right: 20px; /* Start position next to Yes */
        }

        .hidden { display: none !important; }

        video {
            width: 90%;
            max-width: 350px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .fireworks { font-size: 60px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="page1" class="container">
        <h1>Would you forgive me? 🥺</h1>
        <div class="btn-container">
            <button class="yes-btn" onclick="nextPage(2)">Yes</button>
            <button class="no-btn" onmouseover="moveBtn(this)" ontouchstart="moveBtn(this)">No</button>
        </div>
    </div>

    <div id="page2" class="container hidden">
        <h1>Would you go to a restaurant with me on 8th of March? 🌹</h1>
        <div class="btn-container">
            <button class="yes-btn" onclick="nextPage(3)">Yes</button>
            <button class="no-btn" onmouseover="moveBtn(this)" ontouchstart="moveBtn(this)">No</button>
        </div>
    </div>

    <div id="page3" class="container hidden" style="display: flex; flex-direction: column; align-items: center;">
        <h1 style="margin-bottom: 10px;">YOU ARE THE BEST! 🎉</h1>
        <div class="fireworks">🎆✨❤️</div>
        
        <video id="finalVideo" playsinline controls loop>
            <source src="video.mp4" type="video/mp4">
        </video>

        <p style="margin-top: 20px; font-weight: bold; color: #d63384; font-size: 18px;">
            I WILL SEND YOU LOCATION IN DM ✉️❤️
        </p>
    </div>

    <script>
        function moveBtn(btn) {
            // Get screen dimensions
            var width = window.innerWidth;
            var height = window.innerHeight;

            // Calculate new random position
            var newX = Math.random() * (width - 100); // Subtract button width safe zone
            var newY = Math.random() * (height - 100); // Subtract button height safe zone

            // Force the move
            btn.style.position = "fixed";
            btn.style.left = newX + "px";
            btn.style.top = newY + "px";
        }

David Sheva, [17/02/2026 21:38]
function nextPage(pageNumber) {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page3').classList.remove('hidden'); // Fix flex issue
            document.getElementById('page' + pageNumber).classList.remove('hidden');

            if(pageNumber === 3) {
                var vid = document.getElementById('finalVideo');
                vid.play();
            }
        }
    </script>
</body>
</html>
