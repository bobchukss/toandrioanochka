<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You ❤️</title>
    <style>
        /* 1. LAYOUT RESET - Ensures things don't overlap */
        body { 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            background-color: #ffeef2; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; /* Centers everything vertically */
        }

        /* 2. THE TEXT - Forces spacing below it */
        h1 { 
            color: #d63384; 
            font-size: 28px; 
            text-align: center; 
            margin-bottom: 60px; /* Big gap between text and buttons */
            line-height: 1.4;
            z-index: 10;
            pointer-events: none; /* Text won't block touches */
        }

        /* 3. THE BUTTON AREA - A specific box for buttons */
        .btn-box { 
            position: relative; 
            width: 100%; 
            height: 80px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        /* 4. BUTTON STYLES */
        button { 
            padding: 15px 40px; 
            font-size: 20px; 
            border-radius: 50px; 
            border: none; 
            font-weight: bold; 
            color: white; 
            cursor: pointer; 
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }

        /* YES Button - Standard Click */
        .yes { 
            background-color: #ff4d6d; 
            z-index: 100;
            position: relative; /* Stays in the center */
        }

        /* NO Button - The Runaway */
        .no { 
            background-color: #6c757d; 
            position: absolute; /* Allows it to jump anywhere */
            right: 40px; /* Starts slightly to the right */
        }

        /* PAGES */
        .page { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            background-color: #ffeef2;
        }
        
        .hidden { display: none !important; }

        video { width: 90%; max-width: 350px; border-radius: 20px; margin-top: 20px; }
        .fireworks { font-size: 60px; margin-bottom: 10px; }
    </style>

    <script>
        function moveNo(btn) {
            // Screen limits
            var w = window.innerWidth - 100;
            var h = window.innerHeight - 100;
            
            // Random numbers
            var x = Math.random() * w;
            var y = Math.random() * h;
            
            // Force Fixed Position (Teleport mode)
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function nextPage(id) {
            // Hide current page
            document.getElementById('p1').classList.add('hidden');
            document.getElementById('p2').classList.add('hidden');
            document.getElementById('p3').classList.add('hidden');
            
            // Show next page
            var next = document.getElementById(id);
            next.classList.remove('hidden');

            // Play video if on Page 3
            if (id === 'p3') {
                var v = document.getElementById('vid');
                if (v) v.play();
            }
        }
    </script>
</head>
<body>

    <div id="p1" class="page">
        <h1>Would you forgive me? 🥺</h1>
        <div class="btn-box">
            <button class="yes" onclick="nextPage('p2')">Yes</button>
            
            <button class="no" ontouchstart="moveNo(this)" onmouseover="moveNo(this)">No</button>
        </div>
    </div>

    <div id="p2" class="page hidden">
        <h1>Would you go to a restaurant with me on 8th of March? 🌹</h1>
        <div class="btn-box">
            <button class="yes" onclick="nextPage('p3')">Yes</button>
            <button class="no" ontouchstart="moveNo(this)" onmouseover="moveNo(this)">No</button>
        </div>
    </div>

    <div id="p3" class="page hidden">
        <h1>YOU ARE THE BEST! 🎉</h1>
        <div class="fireworks">🎆✨❤️</div>
        
        <video id="vid" playsinline controls loop>
            <source src="video.mp4" type="video/mp4">
            <source src="ScreenRecording_02-17-2026 21-27-43_1.mp4" type="video/mp4"> 
        </video>
        
        <p style="color: #d63384; font-weight: bold; margin-top: 20px;">I WILL SEND YOU LOCATION IN DM ✉️❤️</p>
    </div>

</body>
</html>
