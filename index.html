<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You ❤️</title>
    <style>
        /* 1. LAYOUT RESET */
        body { 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            background-color: #ffeef2; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        /* 2. THE TEXT */
        h1 { 
            color: #d63384; 
            font-size: 26px; 
            text-align: center; 
            margin-bottom: 40px; 
            line-height: 1.4;
            z-index: 10;
            pointer-events: none; 
        }

        /* 3. THE BUTTON AREA */
        .btn-box { 
            position: relative; 
            width: 100%; 
            height: 80px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        /* 4. BUTTON STYLES */
        button { 
            padding: 15px 40px; 
            font-size: 20px; 
            border-radius: 50px; 
            border: none; 
            font-weight: bold; 
            color: white; 
            cursor: pointer; 
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .yes { 
            background-color: #ff4d6d; 
            z-index: 100;
            position: relative; 
        }

        .no { 
            background-color: #6c757d; 
            position: absolute; 
            right: 40px; 
        }

        /* PAGES */
        .page { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            background-color: #ffeef2;
        }
        
        .hidden { display: none !important; }

        /* IMAGE STYLE */
        img { 
            width: 85%; 
            max-width: 350px; 
            border-radius: 20px; 
            margin-top: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
        }
        
        .fireworks { font-size: 60px; margin-bottom: 10px; }
    </style>

    <script>
        function moveNo(btn) {
            var w = window.innerWidth - 100;
            var h = window.innerHeight - 100;
            
            var x = Math.random() * w;
            var y = Math.random() * h;
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function nextPage(id) {
            document.getElementById('p1').classList.add('hidden');
            document.getElementById('p2').classList.add('hidden');
            document.getElementById('p3').classList.add('hidden');
            
            var next = document.getElementById(id);
            next.classList.remove('hidden');
        }
    </script>
</head>
<body>

    <div id="p1" class="page">
        <h1>Would you forgive me? 🥺</h1>
        <div class="btn-box">
            <button class="yes" onclick="nextPage('p2')">Yes</button>
            <button class="no" ontouchstart="moveNo(this)" onmouseover="moveNo(this)">No</button>
        </div>
    </div>

    <div id="p2" class="page hidden">
        <h1>Would you go with me in restaurant to celebrate the 8th of March and my birthday? 🌹</h1>
        <div class="btn-box">
            <button class="yes" onclick="nextPage('p3')">Yes</button>
            <button class="no" ontouchstart="moveNo(this)" onmouseover="moveNo(this)">No</button>
        </div>
    </div>

    <div id="p3" class="page hidden">
        <h1>YOU ARE THE BEST! 🎉</h1>
        <div class="fireworks">🎆✨❤️</div>
        
        <img src="photo_2026-02-17_23-12-06.jpg" alt="Us">
        
        <p style="color: #d63384; font-weight: bold; margin-top: 20px;">I WILL SEND YOU LOCATION IN DM ✉️❤️</p>
    </div>

</body>
</html>
